<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connor Casey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background" aria-hidden="true">
    <video class="background-video" autoplay muted loop playsinline>
      <source src="assets/background.mp4" type="video/mp4">
    </video>
    <div class="background-overlay"></div>
    <audio class="background-audio" autoplay loop preload="auto" src="assets/ambient.mp3"></audio>
  </div>

  <div class="page">
    <header class="header">
      <a class="brand" href="/">
        <img class="brand-logo" src="assets/logo.png" alt="Connor Casey" width="160" height="18">
      </a>
      <nav class="nav">
        <a class="nav-link" href="https://interstellarinsightz.substack.com/" target="_blank" rel="noopener noreferrer">Blog</a>        
        <a class="nav-link" href="https://connoracasey.substack.com/" target="_blank" rel="noopener noreferrer">Musings</a>
        <a class="nav-link" href="https://connor-casey-research.github.io/" target="_blank" rel="noopener noreferrer">Research</a>
      </nav>
    </header>

    <main class="main">
      <p class="intro">
        Former quantum physicist, currently at <a href="https://www.clearpact.co/" target="_blank" rel="noopener noreferrer">Clearpact</a>.
      </p>
      <p class="location">Based in New York, NY</p>
    </main>

    <button class="audio-toggle" type="button" aria-pressed="false" aria-label="Mute audio">Mute</button>
  </div>

  <script>
    const video = document.querySelector(".background-video");
    video.playbackRate = 0.50;

    const audio = document.querySelector(".background-audio");
    const audioToggle = document.querySelector(".audio-toggle");
    audio.volume = 0.3;

    let userMuted = false;
    let unlockArmed = false;

    function setMuted(muted) {
      userMuted = muted;
      audio.muted = muted;
      audioToggle.setAttribute("aria-pressed", String(muted));
      audioToggle.textContent = muted ? "Unmute" : "Mute";
      audioToggle.setAttribute("aria-label", muted ? "Unmute audio" : "Mute audio");
    }

    function playAudio() {
      if (userMuted) return Promise.resolve();
      audio.muted = false;
      return audio.play();
    }

    function unlockAudio() {
      unlockArmed = false;
      if (!userMuted) {
        audio.muted = false;
        audio.play().catch(() => {});
      }
    }

    function armUnlock() {
      if (unlockArmed) return;
      unlockArmed = true;
      document.addEventListener("click", unlockAudio, { once: true, capture: true });
      document.addEventListener("touchstart", unlockAudio, { once: true, capture: true });
    }

    async function initAudio() {
      try {
        await playAudio();
        return;
      } catch {
        audio.muted = true;
        try {
          await audio.play();
        } catch {
          /* waiting for first gesture */
        }
        armUnlock();
      }
    }

    audioToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      setMuted(!userMuted);

      if (userMuted) {
        audio.pause();
        return;
      }

      audio.play().catch(() => {});
    });

    initAudio();
    window.addEventListener("load", initAudio);
  </script>
</body>
</html>
